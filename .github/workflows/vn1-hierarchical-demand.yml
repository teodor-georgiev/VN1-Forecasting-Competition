name: VN1 Hierarchical Demand Correction

on:
  pull_request:
    paths:
      - "vn1_hierarchical_demand.py"
      - "test_vn1_hierarchical_demand.py"
      - ".github/workflows/vn1-hierarchical-demand.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vn1-hierarchical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1-specialists.txt
      - run: python -m pip install -r requirements-vn1-specialists.txt
      - name: Historical causality, hierarchy and Phase 1 gate tests
        run: python -m pytest -q test_vn1_hierarchical_demand.py test_vn1_persistent_bias_specialist.py

  historical-and-phase1:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1-specialists.txt
      - run: python -m pip install -r requirements-vn1-specialists.txt
      - name: Select on Phase 0 and gate once on Phase 1
        run: |
          python -u vn1_hierarchical_demand.py \
            --data-dir . \
            --output results/hierarchical/historical-phase1.json \
            --trees 160 --activity-trees 100 --client-cap 16
      - name: Upload aggregate scores only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vn1-hierarchical-phase0-phase1-aggregate
          path: results/hierarchical/historical-phase1.json
          if-no-files-found: warn
          retention-days: 14

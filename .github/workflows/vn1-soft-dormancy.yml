name: VN1 Soft Dormancy Research Checks
on:
  pull_request:
    paths:
      - "vn1_soft_dormancy.py"
      - "test_vn1_soft_dormancy.py"
      - "docs/VN1_SOFT_DORMANCY_RESULTS.md"
      - ".github/workflows/vn1-soft-dormancy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1.txt
      - name: Install reproducible dependencies
        run: python -m pip install -r requirements-vn1.txt
      - name: Run deterministic chronology and conservation checks
        run: python -m pytest -q test_vn1_soft_dormancy.py

name: VN1 Next Gains Research

on:
  pull_request:
    paths:
      - "vn1_next5_research.py"
      - "test_vn1_next5_research.py"
      - "docs/VN1_NEXT5_RESULTS.md"
      - ".github/workflows/vn1-next5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vn1-next5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1-specialists.txt
      - run: python -m pip install -r requirements-vn1-specialists.txt
      - run: python -m pytest -q test_vn1_next5_research.py

  rolling-phase0:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1-specialists.txt
      - run: python -m pip install -r requirements-vn1-specialists.txt
      - name: Chronological Phase0 full-catalogue rolling-origin validation
        run: |
          python -u vn1_next5_research.py historical --data-dir . --out results/vn1-next5-phase0
      - name: Publish aggregate-only historical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vn1-next5-phase0-aggregate-metrics
          path: results/vn1-next5-phase0/historical.json
          if-no-files-found: warn
          retention-days: 14

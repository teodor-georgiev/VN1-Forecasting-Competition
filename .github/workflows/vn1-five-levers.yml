name: VN1 Five Forecast Improvement Levers

on:
  pull_request:
    paths:
      - "vn1_five_levers.py"
      - "vn1_five_levers_frozen.py"
      - "test_vn1_five_levers.py"
      - "test_vn1_five_levers_frozen.py"
      - "docs/VN1_FIVE_LEVERS_RESULTS.md"
      - ".github/workflows/vn1-five-levers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vn1-five-levers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-vn1.txt
      - name: Verify transformations, price chronology, hierarchy, prelaunch trims
        run: python -m pytest -q test_vn1_five_levers.py test_vn1_five_levers_frozen.py

  phase0-public-sales-only:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-vn1.txt
      - name: Phase 0 train origins 105/118/131/144 and holdout 157
        run: |
          python -u vn1_five_levers.py historical --data-dir . --out results/five-levers-public --trees 80 --activity-trees 100 --baseline-trees 160
      - name: Upload aggregate historical score receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vn1-five-levers-public-historical
          path: results/five-levers-public/historical.json
          if-no-files-found: warn
          retention-days: 14

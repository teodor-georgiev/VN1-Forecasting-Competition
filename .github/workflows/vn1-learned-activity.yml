name: VN1 Learned Activity Research Checks

on:
  pull_request:
    paths:
      - "vn1_learned_activity.py"
      - "test_vn1_learned_activity.py"
      - ".github/workflows/vn1-learned-activity.yml"
      - "docs/VN1_LEARNED_ACTIVITY_RESULTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-vn1.txt
      - name: Verify deterministic learned demand-activity model
        run: python -m pytest -q test_vn1_learned_activity.py

name: VN1 frozen Phase 2 persistent-bias retrospective

on:
  pull_request:
    paths:
      - ".github/workflows/vn1-persistent-bias-phase2.yml"
      - "vn1_persistent_bias_specialist.py"
      - "test_vn1_persistent_bias_specialist.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vn1-persistent-phase2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  historical-then-frozen-score:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1-specialists.txt
      - name: Install pinned research dependencies
        run: python -m pip install -r requirements-vn1-specialists.txt
      - name: Validate freeze, label isolation, and historical selection tests
        run: python -m pytest -q test_vn1_persistent_bias_specialist.py test_vn1_champion_residual_oof.py
      - name: Choose candidate using Phase 0 completed folds only
        run: |
          python -u vn1_persistent_bias_specialist.py \
            --operation historical --data-dir . \
            --output "${{ runner.temp }}/persistent-selection.json" \
            --trees 160 --activity-trees 100 --client-cap 16
      - name: Freeze predictions using Phase 0 and Phase 1 ONLY
        run: |
          python -u vn1_persistent_bias_specialist.py \
            --operation freeze --data-dir . \
            --selection "${{ runner.temp }}/persistent-selection.json" \
            --output "${{ runner.temp }}/persistent-frozen" \
            --trees 160 --activity-trees 100 --client-cap 16
      - name: Retrieve released Phase 2 labels AFTER freezing only
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/released"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen
          import os
          revision = "281dccfa449442774690e9ad639a7d9405e6620c"
          source = f"https://raw.githubusercontent.com/SupChains/VN1/{revision}/Phase%202%20-%20Sales.csv"
          with urlopen(source, timeout=60) as response:
              raw = response.read()
          git_blob = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\\0" + raw).hexdigest()
          assert git_blob == "714205238d3fcebe8a82b0cec97b28f375914d3b", "Released target blob changed"
          dest = Path(os.environ["RUNNER_TEMP"]) / "released" / "Phase 2 - Sales.csv"
          dest.write_bytes(raw)
          print("VN1_RELEASED_PHASE2_HASH_VERIFIED=TRUE")
          PY
      - name: Retrospective final score with sealed forecasts
        run: |
          python -u vn1_persistent_bias_specialist.py \
            --operation score --data-dir . \
            --output "${{ runner.temp }}/persistent-frozen" \
            --truth "${{ runner.temp }}/released/Phase 2 - Sales.csv"
      - name: Reject source mismatch to verified champion benchmark
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "persistent-frozen" / "score-phase2.json"
          data = json.loads(output.read_text())
          champion = data["scores"]["champion"]
          reference = 0.4693382738889349
          if abs(champion-reference) > 1e-8:
              raise SystemExit(f"Phase 2 control mismatch: {champion:.12f} vs reference {reference:.12f}")
          print("VN1_PHASE2_CONTROL_PARITY=PASS")
          print(f"VN1_PHASE2_REMAINING_TO_0450={data['scores']['historical_selected']-0.45:.12f}")
          PY
      - name: Archive aggregate scores only; never labels or forecast arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vn1-persistent-phase2-public-aggregate
          path: "${{ runner.temp }}/persistent-frozen/score-phase2.json"
          retention-days: 14
          if-no-files-found: warn

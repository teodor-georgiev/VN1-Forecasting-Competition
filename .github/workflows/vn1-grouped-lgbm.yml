name: VN1 grouped LightGBM research
on:
  pull_request:
    paths:
      - ".github/workflows/vn1-grouped-lgbm.yml"
      - "vn1_grouped_lgbm.py"
      - "test_vn1_grouped_lgbm.py"
      - "vn1_lgbm_ensemble.py"
      - "requirements-vn1-specialists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1-specialists.txt
      - run: python -m pip install -r requirements-vn1-specialists.txt
      - run: python -m pytest -q test_vn1_grouped_lgbm.py

  retrospective-replay:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1-specialists.txt
      - run: python -m pip install -r requirements-vn1-specialists.txt
      - name: Fetch published Phase 2 labels pinned to source revision
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen
          revision = "281dccfa449442774690e9ad639a7d9405e6620c"
          url = f"https://raw.githubusercontent.com/SupChains/VN1/{revision}/Phase%202%20-%20Sales.csv"
          with urlopen(url, timeout=45) as response:
              payload = response.read()
          digest = hashlib.sha1(b"blob " + str(len(payload)).encode() + bytes([0]) + payload).hexdigest()
          assert digest == "714205238d3fcebe8a82b0cec97b28f375914d3b"
          Path("Phase 2 - Sales.csv").write_bytes(payload)
          PY
      - name: Phase 1 grouped LightGBM retrospective score
        run: |
          python -u vn1_grouped_lgbm.py --phase 1 --trees 160 --clusters 8 \
            --output Phase1_Grouped.csv | tee Phase1_Grouped_metrics.json
      - name: Phase 2 grouped LightGBM retrospective score
        run: |
          python -u vn1_grouped_lgbm.py --phase 2 --trees 160 --clusters 8 \
            --output Phase2_Grouped.csv | tee Phase2_Grouped_metrics.json
      - name: Upload score receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vn1-grouped-lgbm-replay
          path: |
            Phase1_Grouped_metrics.json
            Phase2_Grouped_metrics.json
            Phase1_Grouped.csv
            Phase2_Grouped.csv
          retention-days: 14
          if-no-files-found: warn

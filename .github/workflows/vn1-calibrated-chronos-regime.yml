name: VN1 Calibrated Chronos Regime

on:
  pull_request:
    paths:
      - vn1_calibrated_chronos_regime.py
      - test_vn1_calibrated_chronos_regime.py
      - .github/workflows/vn1-calibrated-chronos-regime.yml
      - docs/VN1_CALIBRATED_CHRONOS_REGIME.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-vn1-specialists.txt
      - name: No Phase 2 tuning, product-order parity and reproducible freeze
        run: python -m pytest -q test_vn1_calibrated_chronos_regime.py test_vn1_foundation_champion_ensemble.py

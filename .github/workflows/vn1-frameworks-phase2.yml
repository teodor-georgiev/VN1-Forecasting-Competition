name: VN1 full Phase 2 framework retrospective (research only)

on:
  pull_request:
    paths:
      - ".github/workflows/vn1-frameworks-phase2.yml"

permissions:
  contents: read

jobs:
  retrospective-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-vn1.txt
            requirements-vn1-frameworks.txt
      - name: Install isolated, version-pinned forecasting frameworks
        run: python -m pip install -r requirements-vn1-frameworks.txt
      - name: Run immutable forecast and score contract tests
        run: python -m pytest -q test_vn1_framework_benchmark.py
      - name: Confirm Phase 2 labels are not available before freeze
        run: test ! -e "Phase 2 - Sales.csv"
      - name: Freeze sktime forecasts without Phase 2 labels
        run: |
          python vn1_framework_benchmark.py --phase2 --sample-size 0 --seed 42 \
            --model sktime --output-dir /tmp/vn1-phase2-sktime
      - name: Freeze Darts forecasts without Phase 2 labels
        run: |
          python vn1_framework_benchmark.py --phase2 --sample-size 0 --seed 42 \
            --model darts --output-dir /tmp/vn1-phase2-darts
      - name: Freeze MLForecast forecasts without Phase 2 labels
        run: |
          python vn1_framework_benchmark.py --phase2 --sample-size 0 --seed 42 \
            --model mlforecast --output-dir /tmp/vn1-phase2-mlforecast
      - name: Verify 15,053 frozen forecasts before retrieving labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          for model in ("sktime", "darts", "mlforecast"):
              root = Path("/tmp/vn1-phase2-" + model)
              m = json.loads((root / "manifest.json").read_text())
              assert m["series_count"] == 15053, (model, m["series_count"])
              assert m["status"] == "frozen_unscored"
              assert list(m["forecasts"]) == [model]
              assert not (root / "phase2_scores.json").exists()
              info = m["forecasts"][model]
              assert sha256((root/info["file"]).read_bytes()).hexdigest() == info["sha256"]
          assert not Path("Phase 2 - Sales.csv").exists()
          print("VN1_PHASE2_ALL_FROZEN_BEFORE_LABELS=PASS")
          PY
      - name: Retrieve published Phase 2 actuals from pinned public revision
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen
          revision = "281dccfa449442774690e9ad639a7d9405e6620c"
          url = f"https://raw.githubusercontent.com/SupChains/VN1/{revision}/Phase%202%20-%20Sales.csv"
          with urlopen(url, timeout=60) as response:
              content = response.read()
          blob = hashlib.sha1(f"blob {len(content)}\0".encode() + content).hexdigest()
          assert blob == "714205238d3fcebe8a82b0cec97b28f375914d3b", blob
          Path("Phase 2 - Sales.csv").write_bytes(content)
          print("VN1_PHASE2_PUBLIC_LABELS_INTEGRITY=PASS", len(content))
          PY
      - name: Score frozen sktime Phase 2 predictions
        run: python vn1_framework_benchmark.py --score-phase2 --output-dir /tmp/vn1-phase2-sktime
      - name: Score frozen Darts Phase 2 predictions
        run: python vn1_framework_benchmark.py --score-phase2 --output-dir /tmp/vn1-phase2-darts
      - name: Score frozen MLForecast Phase 2 predictions
        run: python vn1_framework_benchmark.py --score-phase2 --output-dir /tmp/vn1-phase2-mlforecast
      - name: Validate full Phase 2 official score receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results=[]
          for name in ("sktime", "darts", "mlforecast"):
              result, = json.loads(
                  (Path("/tmp/vn1-phase2-"+name)/"phase2_scores.json").read_text())
              assert result["framework"] == name
              assert result["series"] == 15053
              assert result["period"] == "Phase2_retrospective"
              assert 0 <= result["vn1"] < 10
              results.append(result)
          Path("/tmp/vn1-phase2-frameworks-summary.json").write_text(
              json.dumps(results, indent=2) + "\n")
          print("VN1_PHASE2_ALL_SERIES_SCORED=PASS")
          for r in results:
              print(r["framework"], r["vn1"], r["relative_mae"], r["signed_relative_bias"])
          PY
      - name: Upload independent research receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vn1-frameworks-phase2-retrospective
          path: |
            /tmp/vn1-phase2-sktime/manifest.json
            /tmp/vn1-phase2-sktime/phase2_scores.json
            /tmp/vn1-phase2-darts/manifest.json
            /tmp/vn1-phase2-darts/phase2_scores.json
            /tmp/vn1-phase2-mlforecast/manifest.json
            /tmp/vn1-phase2-mlforecast/phase2_scores.json
            /tmp/vn1-phase2-frameworks-summary.json
          if-no-files-found: warn
          retention-days: 14

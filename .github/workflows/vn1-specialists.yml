name: VN1 adaptive specialists benchmark
on:
  pull_request:
    paths:
      - ".github/workflows/vn1-specialists.yml"
      - "vn1_adaptive.py"
      - "test_vn1_adaptive.py"
      - "requirements-vn1-specialists.txt"
      - "vn1_lgbm_ensemble.py"
      - "vn1_from_scratch.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1-specialists.txt
      - name: Install reproducible dependencies
        run: python -m pip install -r requirements-vn1-specialists.txt
      - name: Run synthetic, leakage and candidate-selection tests
        run: python -m pytest -q test_vn1_adaptive.py test_vn1_lgbm_ensemble.py test_vn1_from_scratch.py

  replay:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1-specialists.txt
      - name: Install reproducible dependencies
        run: python -m pip install -r requirements-vn1-specialists.txt
      - name: Obtain official published Phase 2 targets with blob integrity check
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen
          revision = "281dccfa449442774690e9ad639a7d9405e6620c"
          url = f"https://raw.githubusercontent.com/SupChains/VN1/{revision}/Phase%202%20-%20Sales.csv"
          with urlopen(url, timeout=45) as response:
              payload = response.read()
          digest = hashlib.sha1(f"blob {len(payload)}\0".encode() + payload).hexdigest()
          expected = "714205238d3fcebe8a82b0cec97b28f375914d3b"
          assert digest == expected, f"Unexpected Phase 2 dataset SHA: {digest}"
          Path("Phase 2 - Sales.csv").write_bytes(payload)
          print(f"Verified published Phase 2 actuals: {len(payload)} bytes")
          PY
      - name: Phase 1 adaptive candidates and ensemble
        run: |
          python -u vn1_adaptive.py --phase 1 --trees 160 --theta-cap 120 \
            --output Phase1_Adaptive.csv | tee Phase1_Adaptive_metrics.json
      - name: Phase 2 adaptive candidates and ensemble
        run: |
          python -u vn1_adaptive.py --phase 2 --trees 160 --theta-cap 120 \
            --output Phase2_Adaptive.csv | tee Phase2_Adaptive_metrics.json
      - name: Upload score receipts and forecast CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vn1-adaptive-replay
          path: |
            Phase1_Adaptive_metrics.json
            Phase2_Adaptive_metrics.json
            Phase1_Adaptive.csv
            Phase2_Adaptive.csv
          if-no-files-found: warn
          retention-days: 14

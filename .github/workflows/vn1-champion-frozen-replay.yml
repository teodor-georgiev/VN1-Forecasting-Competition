name: Reproduce frozen VN1 0.469338 ARIMA AMSI champion

on:
  pull_request:
    paths:
      - "reproduce_vn1_champion_frozen.py"
      - "test_reproduce_vn1_champion_frozen.py"
      - ".github/workflows/vn1-champion-frozen-replay.yml"
      - "docs/VN1_CHAMPION_REPRODUCTION.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vn1-frozen-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archived-champion-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout read-only VN1 scorer code and historical sales
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout published official Phase 2 truth at immutable commit
        uses: actions/checkout@v7
        with:
          repository: SupChains/VN1
          ref: 281dccfa449442774690e9ad639a7d9405e6620c
          path: official
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vn1.txt

      - name: Install pinned scorer dependencies
        run: python -m pip install -r requirements-vn1.txt

      - name: Verify official truth Git blob and published source commit
        shell: bash
        run: |
          test "$(git -C official rev-parse HEAD)" = "281dccfa449442774690e9ad639a7d9405e6620c"
          test "$(git -C official hash-object 'Phase 2 - Sales.csv')" = "714205238d3fcebe8a82b0cec97b28f375914d3b"

      - name: Run synthetic arithmetic, alignment and tamper regressions
        run: python -m pytest -q test_reproduce_vn1_champion_frozen.py

      - name: Download the original immutable champion forecasts from run 43060875239
        uses: actions/download-artifact@v4
        with:
          name: vn1-arima-amsi-capped16-evidence
          repository: teodor-georgiev/VN1-Forecasting-Competition
          run-id: 43060875239
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/champion-frozen

      - name: Reproduce published Phase 2 score without retraining or tuning
        shell: bash
        run: |
          python reproduce_vn1_champion_frozen.py \
            --frozen-dir "${{ runner.temp }}/champion-frozen" \
            --truth "official/Phase 2 - Sales.csv" \
            --phase0 "Phase 0 - Sales.csv" \
            --phase1 "Phase 1 - Sales.csv" \
            --report "${{ runner.temp }}/vn1-champion-phase2-score.json"

      - name: Upload ONLY aggregate reproduction receipt
        uses: actions/upload-artifact@v4
        with:
          name: vn1-champion-retrospective-score-aggregate
          path: ${{ runner.temp }}/vn1-champion-phase2-score.json
          if-no-files-found: error
          retention-days: 14

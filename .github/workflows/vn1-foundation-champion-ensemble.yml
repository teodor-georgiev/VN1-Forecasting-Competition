name: VN1 Saved Foundation Champion Ensemble

on:
  pull_request:
    paths:
      - vn1_foundation_champion_ensemble.py
      - test_vn1_foundation_champion_ensemble.py
      - .github/workflows/vn1-foundation-champion-ensemble.yml
      - docs/VN1_FOUNDATION_CHAMPION_ENSEMBLE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-vn1.txt
      - name: No Phase 2 tuning, product-order parity and reproducible freeze
        run: python -m pytest -q test_vn1_foundation_champion_ensemble.py
